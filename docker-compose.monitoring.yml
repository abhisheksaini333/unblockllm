# Phase 7: Self-hosted monitoring (Prometheus + Grafana).
# Run: docker compose -f docker-compose.monitoring.yml up -d
# Grafana: http://localhost:3001 (default admin/admin). Add Prometheus datasource (http://prometheus:9090).
# Optional: add Sentry for error tracking (see docs/DEPLOYMENT.md).

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.2.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3001
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3001"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
