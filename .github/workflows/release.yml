# Create GitHub Release on tag push (e.g. v1.0.0). Builds proxy binary for Linux.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build proxy (release)
        run: cargo build --release --package unblock-proxy

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp target/release/unblock-proxy release/unblock-proxy-x86_64-unknown-linux-gnu

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
