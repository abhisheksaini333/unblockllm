# unblockllm CI: build, test, lint, security (no PII in logs)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --all-features --lib --bins

      - name: Integration tests
        run: cargo test --all-features --test integration

      - name: Cargo audit
        run: |
          cargo install cargo-audit
          cargo audit

      - name: Generate Rust SBOM (proxy)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path crates/unblock-proxy/Cargo.toml -f json
          cp crates/unblock-proxy/unblock-proxy.cdx.json security/sbom-proxy.json

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install (editable + dev)
        run: |
          cd python
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          cd python
          ruff check .
          ruff format --check .

      - name: Pytest
        run: |
          cd python
          pytest -v

      - name: NER benchmark (report only; do not fail on latency)
        run: |
          cd python
          python -m unblockllm.benchmark.ner_benchmark --runs 20 --output benchmark_report.json || true
          if [ -f benchmark_report.json ]; then cat benchmark_report.json; fi

  dashboard:
    name: Next.js Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package.json

      - name: Install
        run: |
          cd apps/dashboard
          npm ci 2>/dev/null || npm install

      - name: Lint
        run: |
          cd apps/dashboard
          npm run lint

      - name: Build
        run: |
          cd apps/dashboard
          npm run build
