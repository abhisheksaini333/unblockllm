[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unblockllm"
version = "0.1.0"
description = "Zero-Trust Privacy Proxy SDK and tools for LLMs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.16.0",
    "transformers>=4.30.0",
    "optimum[onnxruntime]>=1.14.0",
    "tokenizers>=0.15.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "openai>=1.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
unblockllm-scan = "unblockllm.cli.scan:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["unblockllm*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
