# Production compose: proxy + dashboard + Redis + Postgres.
# TLS: use a reverse proxy (nginx/traefik) in front; set REDIS_URL/DATABASE_URL for TLS in production.
# Expose only 80/443 via reverse proxy; do not expose 8080/3000 directly to internet.

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/}
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://dashboard:3000}
      - PROXY_API_KEY=${PROXY_API_KEY}
      - RATE_LIMIT_PER_SECOND=${RATE_LIMIT_PER_SECOND:-1000}
    ports:
      - "8080:8080"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    user: nonroot

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - PROXY_API_KEY=${PROXY_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
    user: nextjs

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unblock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-unblock_audit}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unblock} -d ${POSTGRES_DB:-unblock_audit}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
