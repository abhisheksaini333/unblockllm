[package]
name = "unblock-proxy"
version = "1.0.0"
edition = "2021"
description = "Rust HTTP proxy for LLM APIs with local PII redaction"
license = "MIT"
repository = "https://github.com/unblockllm/unblockllm"

[lib]
name = "unblock_proxy"
path = "src/lib.rs"

[[bin]]
name = "unblock-proxy"
path = "src/main.rs"

[dependencies]
unblock-core = { path = "../unblock-core" }
axum = { version = "0.7", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bytes = "1.5"
thiserror = "2.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4"] }
regex = "1.10"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# SEC-01: Only postgres + rustls. Explicitly no mysql/sqlite/mssql (reduces attack surface; rsa advisory in sqlx-mysql when present—see docs/SECURITY.md).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
governor = "0.6"
tower_governor = "0.4"
sentry = "0.34"

[dev-dependencies]
reqwest = { version = "0.12", features = ["stream", "json"] }
tower = "0.5"
http-body-util = "0.1"

[[bench]]
name = "latency"
harness = false
