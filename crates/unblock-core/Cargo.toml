[package]
name = "unblock-core"
version = "1.0.0"
edition = "2021"
description = "Core types, redaction logic, and ONNX NER integration for unblockllm"
license = "MIT"
repository = "https://github.com/unblockllm/unblockllm"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
prost = "0.13"
bytes = "1.5"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
